[package]
name = "pw-term"
description = "Portal Workspaces terminal engine: PTY sessions, input encoding and render snapshots"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
alacritty_terminal.workspace = true
# alacritty's PTY traits take its poller types; same version as alacritty's.
polling = "3"
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libproc = "0.14"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
