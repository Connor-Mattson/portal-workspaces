[workspace]
resolver = "2"
members = ["crates/pw-model", "crates/pw-term", "crates/pw-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Connor Mattson"]
rust-version = "1.88"

[workspace.dependencies]
pw-model = { path = "crates/pw-model" }
pw-term = { path = "crates/pw-term" }
iced = { version = "0.14", default-features = false }
alacritty_terminal = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
directories = "6"
rfd = "0.17"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
